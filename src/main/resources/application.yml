server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:riskdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all

logging:
  level:
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
